name: Kernel build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex \
          libelf-dev libssl-dev lz4 python3 xxd kmod device-tree-compiler \
          gcc-aarch64-linux-gnu

      - name: Clone kernel
        run: |
         git clone --filter=blob:none --no-checkout \
         https://github.com/LineageOS/android_kernel_samsung_sm7125.git kernel
         cd kernel
         git fetch --no-tags origin \
         f6bbda4e5986f09e4d51ceffd1b645b2d5aa75b4
         git checkout --detach f6bbda4e5986f09e4d51ceffd1b645b2d5aa75b4
         git status
         git log -1 --oneline

      - name: KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/vendor/lineage-a52q_defconfig

      - name: Get clang
        run: |
          mkdir -p "$HOME/tc"
          # Официальный AOSP clang того же поколения, что собирал nightly (r596125):
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2024/clang-r522817.tar.gz -O clang.tgz
          tar -xzf clang.tgz -C "$HOME/tc"
          "$HOME/tc/bin/clang" --version

      - name: Build
        run: |
          cd kernel
          export PATH="$HOME/tc/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/lineage-a52q_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          ls -l out/arch/arm64/boot/Image.gz-dtb

      - name: Repack boot.img
        env:
          BOOT_URL: ${{ secrets.BOOT_IMG_URL }}
        run: |
          wget -qO boot.img "$BOOT_URL"
          wget -qO magiskboot https://github.com/topjohnwu/Magisk/releases/latest/download/magiskboot
          # если release-asset недоступен, возьми magiskboot из apk:
          # unzip -j app-release.apk 'lib/arm64-v8a/libmagiskboot.so' && mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          ./magiskboot unpack boot.img
          cp kernel/out/arch/arm64/boot/Image.gz-dtb kernel
          ./magiskboot repack boot.img new-boot.img

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: boot-ksu-next
          path: new-boot.img
