name: Build KSU-Next + SUSFS (Linux 4.14) for A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        run: |
          sudo apt update && sudo apt install -y \
              build-essential libncurses-dev bison flex libssl-dev \
              libelf-dev bc python3 git wget ccache lld patch

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p ~/clang
          # Скачиваем официальный архив пребилдов Clang от Google (версия r475365 / Clang 16-17)
          wget -qO clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r475365.tar.gz" || \
          wget -qO clang.tar.gz "https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_aosp-clang/-/archive/14.0/android_prebuilts_clang_host_linux-x86_aosp-clang-14.0.tar.gz" || \
          git clone https://github.com/akhilnarang/scripts.git ~/toolchain_scripts
          
          # Распаковываем скачанный архив в папку ~/clang
          if [ -f "clang.tar.gz" ]; then
              tar -xzf clang.tar.gz -C ~/clang
          else
              # Запасной вариант: клонирование легкого зеркала без указания проблемных веток
              git clone https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_aosp-clang.git --depth=1 ~/clang
          fi

      - name: Inject KernelSU-Next and SUSFS
        run: |
          git clone https://github.com/rifsxd/KernelSU-Next.git -b next drivers/kernelsu
          git clone https://gitlab.com/simonpunk/kernel_patches.git --depth=1 -b 4.14 susfs_patches
          
          if [ -d "fs/susfs" ]; then
              echo "SUSFS already present or copied"
          else
              cp -r susfs_patches/50_add_susfs_in_kernel-4.14/fs/susfs fs/ || true
          fi

          for f in susfs_patches/50_add_susfs_in_kernel-4.14/*.patch; do
              echo "Applying $f"
              patch -p1 < "$f" || echo "Warning: patch $f had issues"
          done

      - name: Start Kernel Compilation
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          
          CONFIG_FILE="a52xq_defconfig" 

          make O=out $CONFIG_FILE
          
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_SUSFS=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> out/.config
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> out/.config

          make O=out CC=clang LD=ld.lld -j$(nproc)

      - name: Prepare AnyKernel3 & Pack
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          
          if [ -f "out/arch/arm64/boot/Image" ]; then
              cp out/arch/arm64/boot/Image anykernel/
          else
              echo "Error: Image not found!"
              exit 1
          fi

          cd anykernel
          rm -rf .git README.md
          zip -r9 ../KSU-Next-SUSFS-Android14-A52.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Next-SUSFS-Android14-A52
          path: KSU-Next-SUSFS-Android14-A52.zip